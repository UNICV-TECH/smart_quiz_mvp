<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Smart Quiz</title>
  <script>
    // Single Page App redirect for static hosting (GitHub Pages, etc.)
    // Stores the current path and redirects to index.html, which then
    // restores the path via history.replaceState before Flutter loads.
    sessionStorage.setItem('spa-redirect', window.location.pathname + window.location.search + window.location.hash);
    window.location.replace('/');
  </script>
</head>
<body>
</body>
</html>
