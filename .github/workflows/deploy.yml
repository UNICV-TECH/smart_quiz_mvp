name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  # Job 1: Análise de código (lint)
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

  # Job 2: Testes (depende do analyze)
  test:
    name: Test
    needs: analyze
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  # Job 3a: descobre os arquivos de integration_test e gera a matrix.
  # Roda só em PRs para main e push na main (não em push de develop).
  e2e-list:
    name: E2E (listar testes)
    needs: analyze
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    outputs:
      files: ${{ steps.set.outputs.files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Listar *_test.dart como JSON
        id: set
        run: |
          files=$(printf '%s\n' integration_test/*_test.dart | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "matrix: $files"

  # Job 3b: E2E (integration_test dirigindo o app real contra Supabase local).
  # Cada arquivo roda em PARALELO, em seu próprio job, com um Supabase fresco +
  # seed dedicado — isolamento total (nenhum teste depende do estado de outro).
  e2e:
    name: 'E2E: ${{ matrix.file }}'
    needs: e2e-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.e2e-list.outputs.files) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Instalar dependências de Linux desktop + ferramentas de seed
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev \
            xvfb postgresql-client jq

      - name: Habilitar Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Subir Supabase local (aplica migrations baseline + RLS)
        run: supabase start

      - name: Semear dados E2E (aluno + curso + questões)
        run: bash scripts/e2e_setup.sh

      - name: Rodar ${{ matrix.file }} (Linux desktop, headless via xvfb)
        run: |
          ANON=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'"' -f2)
          xvfb-run -a flutter test "${{ matrix.file }}" -d linux \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_ANON_KEY="$ANON"

      - name: Parar Supabase local
        if: always()
        run: supabase stop || true

  # Job 4: Build e Deploy (depende do test, só roda na main)
  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web release
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=APP_BASE_URL=${{ secrets.APP_BASE_URL }}

      - name: Deploy build files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Salvar build gerado
          cp -r build/web /tmp/web-build
          # Descartar mudanças locais e sincronizar com remote
          git checkout -- .
          git clean -fd
          git pull --rebase origin main
          # Remover build antigo e restaurar build novo
          rm -rf build/web
          mv /tmp/web-build build/web
          git add build/web -f
          git diff --staged --quiet || git commit -m "chore: build web release [skip ci]"
          git push
